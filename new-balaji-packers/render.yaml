services:
  - type: web
    name: new-balaji-packers
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn balaji_packers.wsgi:application"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@balajipackers.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "admin123"
      - key: PYTHON_VERSION
        value: "3.11.8"
